name: Feature Architect — Improvement Proposals

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus area'
        required: false
        default: 'general'
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  propose-improvements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect repository signals
        env:
          FOCUS: ${{ github.event.inputs.focus || 'scheduled/general' }}
        run: |
          {
            echo "# Feature Architect task"
            echo
            echo "- Branch: ${{ github.ref_name }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Focus: ${FOCUS}"
            echo
            echo "## Signals"
            echo "- C# source files: $(find . -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' | wc -l)"
            echo "- Test files: $(find . -name '*Test*.cs' -o -name '*Tests*.cs' | wc -l)"
            echo "- TODO/FIXME/HACK count: $(grep -r -i -E 'TODO|FIXME|HACK' --include='*.cs' --include='*.md' . 2>/dev/null | wc -l || true)"
            echo "- Workflows present: $(find .github/workflows -maxdepth 1 -type f 2>/dev/null | wc -l)"
            echo
            echo "## Required proposal contract"
            echo "1. Problem"
            echo "2. Proposed function"
            echo "3. User benefit"
            echo "4. Evidence / source"
            echo "5. Implementation location"
            echo "6. Dependencies"
            echo "7. Security / safety impact"
            echo "8. Test plan"
            echo "9. Real load target required?"
            echo "10. Status"
            echo
            echo "## Governance"
            echo "- No automatic GitHub issue creation."
            echo "- Evidence and security review precede implementation."
            echo "- Use the Research Ledger for external-source decisions."
            echo "- Keep high-risk network/load actions bounded and authorization-gated."
          } > feature-architect-task.md
          cat feature-architect-task.md

      - name: Publish task artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-architect-task
          path: feature-architect-task.md
          if-no-files-found: error
