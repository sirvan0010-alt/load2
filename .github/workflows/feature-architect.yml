name: Feature Architect — Improvement Proposals

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus area (e.g. metrics, efficiency, UX)"
        required: false
        default: general
        type: string
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: feature-architect-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  propose-improvements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect repository signals
        env:
          FOCUS: ${{ inputs.focus || 'scheduled/general' }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            printf '%s\n' '### Repository snapshot'
            printf '%s\n' "- Branch: $BRANCH"
            printf '%s\n' "- SHA: $COMMIT_SHA"
            printf '%s\n' "- Focus input: $FOCUS"
            printf '%s\n' ''
            printf '%s\n' '### Quick static signals'
            printf '%s\n' "- C# source files: $(find . -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' | wc -l)"
            printf '%s\n' "- Test files: $(find . \( -name '*Test*.cs' -o -name '*Tests*.cs' \) -not -path '*/bin/*' -not -path '*/obj/*' | wc -l)"
            printf '%s\n' "- TODO/FIXME count: $(grep -r -i -E 'TODO|FIXME|HACK' --include='*.cs' --include='*.md' --exclude-dir=.git . 2>/dev/null | wc -l || true)"
            printf '%s\n' "- Workflows present: $(find .github/workflows -maxdepth 1 -type f | wc -l)"
            printf '%s\n' ''
            printf '%s\n' '### Existing AI documents'
            find . -maxdepth 1 -type f -name 'AI_*.md' -printf '%f\n' | sort || true
          } > /tmp/signals.md
          cat /tmp/signals.md

      - name: Create Feature Architect proposal issue
        uses: actions/github-script@v7
        env:
          FOCUS: ${{ inputs.focus || 'scheduled/general' }}
        with:
          script: |
            const fs = require('fs');
            const signals = fs.readFileSync('/tmp/signals.md', 'utf8');
            const focus = process.env.FOCUS || 'general';
            const title = `[Feature Architect] Improvement proposals — ${focus} (${new Date().toISOString().slice(0, 10)})`;

            const body = [
              '## Feature Architect — structured proposals',
              '',
              'This issue was opened by the **Feature Architect** workflow.',
              'It follows the 10-point proposal format defined in `AI_AGENT_REGISTRY.md`.',
              '',
              `**Focus:** ${focus}`,
              '',
              '### Signals collected',
              '',
              signals,
              '---',
              '',
              '### Proposal template (copy & fill for each idea)',
              '',
              '**1. Problem**',
              '...',
              '',
              '**2. Proposed function**',
              '...',
              '',
              '**3. User benefit**',
              '...',
              '',
              '**4. Evidence / source**',
              '...',
              '',
              '**5. Implementation location**',
              '...',
              '',
              '**6. Dependencies**',
              '...',
              '',
              '**7. Security / safety impact**',
              '...',
              '',
              '**8. Test plan**',
              '...',
              '',
              '**9. Real load target required?**',
              'Yes / No / Later',
              '',
              '**10. Status**',
              '`IDEA` | `PROPOSED` | `MODELED` | `IMPLEMENTED` | `VERIFIED`',
              '',
              '---',
              '',
              '### Instructions for maintainers / AI agents',
              '',
              '1. Review signals and existing open issues.',
              '2. Add one or more filled 10-point proposals as comments or edit this body.',
              '3. Let `SECURITY_AGENT` and `EVIDENCE_AGENT` review before implementation.',
              '4. Prioritise according to the Priority model in `AI_AGENT_REGISTRY.md`.',
              '5. Close or convert to concrete implementation issues when ready.',
              '',
              '*Generated by .github/workflows/feature-architect.yml*'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['feature-architect', 'enhancement', 'needs-triage']
            });

            core.info(`Created Feature Architect issue #${issue.data.number}: ${issue.data.html_url}`);
