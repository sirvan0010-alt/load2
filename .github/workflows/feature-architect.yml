name: Feature Architect — Improvement Proposals

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus area (e.g. metrics, HTTP/2, efficiency, UX)'
        required: false
        default: 'general'
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  propose-improvements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect repository signals
        id: signals
        run: |
          echo "Collecting lightweight signals for Feature Architect..."
          {
            echo "### Repository snapshot"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Focus input: ${{ github.event.inputs.focus || 'scheduled/general' }}"
            echo ""
            echo "### Quick static signals"
            echo "- C# source files: $(find . -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' | wc -l)"
            echo "- Test files: $(find . -name '*Test*.cs' -o -name '*Tests*.cs' | wc -l)"
            echo "- TODO/FIXME count: $(grep -r -i -E 'TODO|FIXME|HACK' --include='*.cs' --include='*.md' . 2>/dev/null | wc -l || echo 0)"
            echo "- Workflows present: $(ls .github/workflows 2>/dev/null | wc -l)"
            echo ""
            echo "### Existing AI documents"
            ls -1 AI_*.md 2>/dev/null || echo "(none found)"
          } > /tmp/signals.md
          cat /tmp/signals.md

      - name: Create Feature Architect proposal issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const signals = fs.readFileSync('/tmp/signals.md', 'utf8');
            const focus = '${{ github.event.inputs.focus || 'general' }}';
            const title = `[Feature Architect] Improvement proposals — ${focus} (${new Date().toISOString().slice(0,10)})`;

            const body = `
## Feature Architect — structured proposals

This issue was opened by the **Feature Architect** workflow.
It follows the 10-point proposal format defined in \`AI_AGENT_REGISTRY.md\`.

**Focus:** \`${focus}\`

### Signals collected

${signals}

---

### Proposal template (copy & fill for each idea)

**1. Problem**  
...

**2. Proposed function**  
...

**3. User benefit**  
...

**4. Evidence / source**  
...

**5. Implementation location**  
...

**6. Dependencies**  
...

**7. Security / safety impact**  
...

**8. Test plan**  
...

**9. Real load target required?**  
Yes / No / Later

**10. Status**  
\`IDEA\` | \`PROPOSED\` | \`MODELED\` | \`IMPLEMENTED\` | \`VERIFIED\`

---

### Instructions for maintainers / AI agents

1. Review signals and existing open issues.
2. Add one or more filled 10-point proposals as comments or edit this body.
3. Let \`SECURITY_AGENT\` and \`EVIDENCE_AGENT\` review before implementation.
4. Prioritise according to the Priority model in \`AI_AGENT_REGISTRY.md\`.
5. Close or convert to concrete implementation issues when ready.

*Generated by .github/workflows/feature-architect.yml*
`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['feature-architect', 'enhancement', 'needs-triage']
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
