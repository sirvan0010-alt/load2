name: Actions Hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-hygiene:
    name: Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate workflow YAML and security hygiene
        run: python3 scripts/check-workflow-hygiene.py
