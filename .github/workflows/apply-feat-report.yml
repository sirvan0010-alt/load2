name: Apply FEAT-REPORT Models/runner
on:
  push:
    paths:
      - 'tools/apply_feat_report.py'
      - '.github/workflows/apply-feat-report.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_feat_report.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/Models.cs src/MailLoadTester.Core/SmtpTestRunner.cs
          if git diff --cached --quiet; then echo none; else
            git commit -m "feat(report): wire RunId + EndpointHealth into Models/runner"
            git push
          fi
          git rm -f tools/apply_feat_report.py .github/workflows/apply-feat-report.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove FEAT-REPORT apply tooling"
            git push
          fi
