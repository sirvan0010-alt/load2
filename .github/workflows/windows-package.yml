name: Windows package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore src/MailLoadTester.Core/MailLoadTester.Core.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904
          dotnet restore tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904
          dotnet restore src/MailLoadTester.Gui/MailLoadTester.Gui.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904

      - name: Build Core and tests
        run: |
          dotnet build src/MailLoadTester.Core/MailLoadTester.Core.csproj -c Release --no-restore
          dotnet build tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -c Release --no-build

      - name: Publish self-contained Windows application
        run: dotnet publish src/MailLoadTester.Gui/MailLoadTester.Gui.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Add quick-start instructions and checksum
        shell: pwsh
        run: |
          @'
          MAILLOADTESTER - WINDOWS QUICK START

          1. Extract this ZIP to any folder (for example Downloads).
          2. Double-click MailLoadTester.exe.
          3. Enter the SMTP server, port, TLS mode and test mailbox details in the app.
          4. Start with Test Mode or Dry-run before sending real messages.

          This is a self-contained Windows x64 build. The .NET runtime and .NET SDK
          do not need to be installed separately.

          Only test systems and recipients you are explicitly authorized to test.
          '@ | Set-Content -Path publish\START-HERE.txt -Encoding UTF8
          $exe = Get-FileHash publish\MailLoadTester.exe -Algorithm SHA256
          "$($exe.Hash)  MailLoadTester.exe" | Set-Content -Path publish\SHA256SUMS.txt -Encoding ASCII
          Compress-Archive -Path publish\* -DestinationPath MailLoadTester-win-x64.zip -Force

      - name: Verify packaged executable and checksum
        shell: pwsh
        run: |
          $archive = [System.IO.Compression.ZipFile]::OpenRead("MailLoadTester-win-x64.zip")
          try {
            $exe = $archive.GetEntry("MailLoadTester.exe")
            $quickStart = $archive.GetEntry("START-HERE.txt")
            $checksums = $archive.GetEntry("SHA256SUMS.txt")
            if ($null -eq $exe -or $exe.Length -lt 1MB) { throw "Packaged executable is missing or unexpectedly small." }
            if ($null -eq $quickStart -or $null -eq $checksums) { throw "Package is missing quick-start or checksum file." }
            $stream = $exe.Open()
            try {
              $actualHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)).ToLowerInvariant()
            } finally {
              $stream.Dispose()
            }
            $reader = [System.IO.StreamReader]::new($checksums.Open())
            try { $checksumLine = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Packaged executable SHA-256 does not match SHA256SUMS.txt." }
            Write-Host "Package contents and executable SHA-256 verified: $actualHash"
          } finally {
            $archive.Dispose()
          }

      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MailLoadTester-win-x64
          path: MailLoadTester-win-x64.zip
          if-no-files-found: error
          retention-days: 30
