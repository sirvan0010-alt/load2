name: Patch Test Compile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-test-compile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix test compile errors
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def fix_handle_client(path):
              p = Path(path)
              if not p.exists():
                  print('skip', path)
                  return
              t = p.read_text(encoding='utf-8')
              t2, n = re.subn(
                  r'(private (?:static )?async Task HandleClientAsync\(TcpClient client, CancellationToken ct\)\s*\{\s*)using \(client\)\s*\n(\s*)await using var stream',
                  r'\1using (client)\n\2{\n\2await using var stream',
                  t,
                  count=1,
              )
              if n == 0:
                  print(path, 'using pattern not found (maybe already fixed)')
                  return
              t2 = t2.replace('private static async Task HandleClientAsync', 'private async Task HandleClientAsync')
              start = t2.find('private async Task HandleClientAsync')
              using_open = t2.find('using (client)', start)
              using_brace = t2.find('{', using_open)
              depth = 0
              using_end = None
              for j in range(using_brace, len(t2)):
                  if t2[j] == '{': depth += 1
                  elif t2[j] == '}':
                      depth -= 1
                      if depth == 0:
                          using_end = j
                          break
              if using_end is None:
                  raise SystemExit(f'using end not found in {path}')
              t2 = t2[:using_end+1] + '\n        }' + t2[using_end+1:]
              p.write_text(t2, encoding='utf-8')
              print(path, 'fixed')

          fix_handle_client('tests/MailLoadTester.Tests/SmtpTestRunnerTests.cs')
          fix_handle_client('tests/MailLoadTester.Tests/SmtpConnectionPoolTests.cs')

          p = Path('tests/MailLoadTester.Tests/SmartPaceControllerTests.cs')
          t = p.read_text(encoding='utf-8')
          t2 = t.replace('new SmartPaceController(Opts(1000))', 'new SmartPaceController(BaseOptions(1000))')
          p.write_text(t2, encoding='utf-8')
          print('SmartPace', 'changed' if t2 != t else 'no change')

          p = Path('tests/MailLoadTester.Tests/RandomTestDataTests.cs')
          t = p.read_text(encoding='utf-8')
          t = t.replace('estimate.RequestedPerAttachmentBytes', 'estimate.EstimatedBytes')
          t = t.replace('estimate.EstimatedTransientBytes', 'estimate.EstimatedBytes')
          t = t.replace('estimate.WorstCaseBytes', 'estimate.EstimatedBytes')
          t = t.replace('estimate.SafeBudgetBytes', 'estimate.BudgetBytes')
          p.write_text(t, encoding='utf-8')
          print('RandomTestDataTests property renames done')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/MailLoadTester.Tests/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(tests): compile errors — using braces, Opts, estimate props, static HandleClient"
            git push
          fi
