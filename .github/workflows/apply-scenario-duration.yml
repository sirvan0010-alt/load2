name: Apply scenario duration + GUI diagnostics
on:
  push:
    paths:
      - 'tools/apply_scenario_duration.py'
      - '.github/workflows/apply-scenario-duration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_scenario_duration.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/Models.cs src/MailLoadTester.Core/SmtpTestRunner.cs src/MailLoadTester.Gui/MainForm.cs || true
          if git diff --cached --quiet; then echo none; else
            git commit -m "feat(scenario): wire DurationSeconds + GUI TransportDiagnostics"
            git push
          fi
          git rm -f tools/apply_scenario_duration.py .github/workflows/apply-scenario-duration.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove scenario-duration apply tooling"
            git push
          fi
