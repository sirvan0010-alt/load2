name: Patch Cancelled Flag

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/patch-cancel-flag.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SmtpTestRunner worker cancel
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/MailLoadTester.Core/SmtpTestRunner.cs')
          t = p.read_text()
          old = '''                    catch (OperationCanceledException) when (workerCt.IsCancellationRequested)
                    {
                        // Cancellation is coordinated by batchCts/outer ct.
                    }'''
          new = '''                    catch (OperationCanceledException) when (workerCt.IsCancellationRequested)
                    {
                        // Workers must surface user cancel to the run result.
                        // Otherwise, if the work channel was already fully written,
                        // Task.WhenAll completes successfully and Cancelled stays false
                        // even though SEND/retry was aborted mid-flight (BUG 1.5).
                        cancelled = true;
                    }'''
          if old not in t:
              if 'cancelled = true;' in t and 'workerCt.IsCancellationRequested' in t:
                  print('already patched')
              else:
                  raise SystemExit('pattern not found')
          else:
              p.write_text(t.replace(old, new, 1))
              print('patched')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/SmtpTestRunner.cs
          git diff --cached --quiet || (git commit -m "fix(runner): set Cancelled=true when workers abort mid-flight (1.5)" && git push)
