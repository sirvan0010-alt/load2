name: Agent Collaboration Contract

on:
  push:
    branches: [ "main", "fix/**", "feat/**" ]
    paths:
      - "AI_AGENT_REGISTRY.md"
      - "docs/AI-GUIDE.md"
      - "docs/AI_AGENT_EXTENSIONS.md"
      - "docs/LOAD2-GAP-MATRIX.md"
      - "docs/RESEARCH-LEDGER.json"
      - "docs/AI-SWARM-ARCHITECTURE.md"
      - ".github/workflows/agent-collaboration.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "AI_AGENT_REGISTRY.md"
      - "docs/AI-GUIDE.md"
      - "docs/AI_AGENT_EXTENSIONS.md"
      - "docs/LOAD2-GAP-MATRIX.md"
      - "docs/RESEARCH-LEDGER.json"
      - "docs/AI-SWARM-ARCHITECTURE.md"
      - ".github/workflows/agent-collaboration.yml"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional collaboration focus"
        required: false
        default: "contract"

permissions:
  contents: read

jobs:
  contract:
    name: Agent contract and source-of-truth gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify agent documents
        shell: bash
        run: |
          set -euo pipefail
          test -f AI_AGENT_REGISTRY.md
          test -f docs/AI-GUIDE.md
          test -f docs/AI_AGENT_EXTENSIONS.md
          test -f docs/LOAD2-GAP-MATRIX.md
          test -f docs/RESEARCH-LEDGER.json
          test -f docs/AI-SWARM-ARCHITECTURE.md

          required=(
            ORCHESTRATOR
            SMTP_PROTOCOL_AGENT
            LOAD_ENGINE_AGENT
            NETWORK_AGENT
            METRICS_AGENT
            SCENARIO_AGENT
            EVIDENCE_AGENT
            SECURITY_AGENT
            FEATURE_ARCHITECT_AGENT
            EFFICIENCY_AGENT
            TEST_AGENT
            UX_AGENT
            RESEARCH_AGENT
            NETWORK_STRESS_AGENT
            INTEGRATION_AGENT
            RELEASE_AGENT
          )

          for role in "${required[@]}"; do
            if ! grep -RIn --fixed-strings "`$role`" AI_AGENT_REGISTRY.md docs/AI_AGENT_EXTENSIONS.md >/dev/null; then
              echo "ERROR: required role missing from agent contract: $role"
              exit 1
            fi
          done

          grep -Fq -- '--unauthorized' docs/AI-GUIDE.md
          echo "Agent contract is present and source-of-truth rules are intact."

  research-ledger-gate:
    name: Research Ledger schema and consistency gate
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate RESEARCH-LEDGER.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          path = "docs/RESEARCH-LEDGER.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          required_top = ["schemaVersion", "lifecycleStates", "decisionTags", "repositories", "mechanisms", "rules"]
          for k in required_top:
              if k not in data:
                  print(f"ERROR: missing top-level key: {k}")
                  sys.exit(1)

          allowed = set(data["lifecycleStates"])
          for repo in data.get("repositories", []):
              if "id" not in repo or "name" not in repo or "status" not in repo:
                  print(f"ERROR: repository entry incomplete: {repo}")
                  sys.exit(1)
              if repo["status"] not in allowed:
                  print(f"ERROR: invalid repository status {repo['status']} for {repo['id']}")
                  sys.exit(1)

          for m in data.get("mechanisms", []):
              if "id" not in m or "status" not in m:
                  print(f"ERROR: mechanism entry incomplete: {m}")
                  sys.exit(1)
              if m["status"] not in allowed:
                  print(f"ERROR: invalid mechanism status {m['status']} for {m.get('id')}")
                  sys.exit(1)

          rules = data.get("rules", {})
          for rk in ("unknownStaysPending", "noInventedRevisions", "noInventedMechanisms",
                     "researchAgentOwnsCompleteness", "orchestratorCannotCloseWithOpenMechanisms"):
              if rk not in rules:
                  print(f"ERROR: missing rule: {rk}")
                  sys.exit(1)

          print("Research Ledger schema and consistency OK.")
          PY

  specialist-handoffs:
    name: Specialist handoff ${{ matrix.agent }}
    needs: [contract, research-ledger-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - RESEARCH_AGENT
          - NETWORK_STRESS_AGENT
          - INTEGRATION_AGENT
          - RELEASE_AGENT
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate deterministic handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-handoffs
          case "${{ matrix.agent }}" in
            RESEARCH_AGENT)
              scope="external source audit; mechanism classification; research ledger completeness"
              ;;
            NETWORK_STRESS_AGENT)
              scope="bounded TCP/network stress dimensions; timeouts; connection rate/concurrency; IPv4/IPv6"
              ;;
            INTEGRATION_AGENT)
              scope="pipeline integrity; duplicate pacing/queue/retry/metrics detection; cross-layer boundaries"
              ;;
            RELEASE_AGENT)
              scope="CI/CodeQL/action hygiene; packaging; documentation; release evidence"
              ;;
          esac
          {
            echo "# Agent handoff"
            echo ""
            echo "- Agent: ${{ matrix.agent }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Focus: ${{ github.event.inputs.focus || 'automatic' }}"
            echo "- Scope: $scope"
            echo "- Status: READY_FOR_ORCHESTRATOR"
            echo ""
            echo "## Required evidence"
            echo "- current main/source state"
            echo "- research ledger consistency"
            echo "- focused tests where implementation changes"
            echo "- security/authorization review"
            echo "- CI/CodeQL evidence where applicable"
          } > "agent-handoffs/${{ matrix.agent }}.md"

      - name: Upload handoff
        uses: actions/upload-artifact@v4
        with:
          name: agent-handoff-${{ matrix.agent }}
          path: agent-handoffs/${{ matrix.agent }}.md
          if-no-files-found: error

  orchestrator:
    name: Orchestrator handoff gate
    needs: specialist-handoffs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate collaboration pipeline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ORCHESTRATOR' AI_AGENT_REGISTRY.md
          grep -Fq 'SECURITY_AGENT' AI_AGENT_REGISTRY.md
          grep -Fq 'EVIDENCE_AGENT' AI_AGENT_REGISTRY.md
          grep -Fq 'TEST_AGENT' AI_AGENT_REGISTRY.md
          grep -Fq 'INTEGRATION_AGENT' docs/AI_AGENT_EXTENSIONS.md
          grep -Fq 'RELEASE_AGENT' docs/AI_AGENT_EXTENSIONS.md
          grep -Fq 'NETWORK_STRESS_AGENT' docs/AI_AGENT_EXTENSIONS.md
          grep -Fq 'RESEARCH_AGENT' docs/AI_AGENT_EXTENSIONS.md
          test -f docs/RESEARCH-LEDGER.json
          echo "ORCHESTRATOR collaboration + Research Ledger contract validated."
