name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  EnableWindowsTargeting: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MailLoadTester.sln /p:EnableWindowsTargeting=true

      - name: Build Release
        run: dotnet build MailLoadTester.sln -c Release --no-restore /p:EnableWindowsTargeting=true

      - name: Test Release
        run: dotnet test MailLoadTester.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" /p:EnableWindowsTargeting=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
