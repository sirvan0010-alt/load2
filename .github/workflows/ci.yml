name: CI

on:
  push:
    branches: [main, "fix/**", "review/**"]
  pull_request:
  workflow_dispatch:

# CodeQL actions/missing-workflow-permissions — least privilege for GITHUB_TOKEN.
permissions:
  contents: read

# Avoid wasting runners on superseded commits or duplicate push/PR runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate user documentation links
        run: python3 scripts/check-user-doc-links.py

      - name: Check workflow hygiene
        run: python3 scripts/check-workflow-hygiene.py

      - name: Check release version synchronization
        shell: bash
        run: |
          version="$(cat VERSION | tr -d '\r\n')"
          app_version="$(sed -n 's/.*Current = "\([^"]*\)".*/\1/p' src/MailLoadTester.Core/AppVersion.cs)"
          build_readme_version="$(sed -n 's/^# MailLoadTester \([0-9.]*\).*/\1/p' README-BUILD.md)"
          test -n "$version"
          test "$version" = "$app_version"
          test "$version" = "$build_readme_version"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore Core + Tests
        run: |
          dotnet restore src/MailLoadTester.Core/MailLoadTester.Core.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904
          dotnet restore tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904

      - name: Build Release
        run: |
          dotnet build src/MailLoadTester.Core/MailLoadTester.Core.csproj -c Release --no-restore
          dotnet build tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -c Release --no-restore

      - name: Test Release (full suite, no quarantine filter)
        run: dotnet test tests/MailLoadTester.Tests/MailLoadTester.Tests.csproj -c Release --no-build --logger "console;verbosity=detailed"

  build-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore Windows Forms GUI
        run: dotnet restore src/MailLoadTester.Gui/MailLoadTester.Gui.csproj

      - name: Build Windows Forms GUI (Release)
        run: dotnet build src/MailLoadTester.Gui/MailLoadTester.Gui.csproj -c Release --no-restore
