name: Apply multi-account Models+runner
on:
  push:
    paths:
      - 'tools/apply_multi_account.py'
      - '.github/workflows/apply-multi-account.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_multi_account.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/Models.cs src/MailLoadTester.Core/SmtpTestRunner.cs
          if git diff --cached --quiet; then echo none; else
            git commit -m "feat(account): Accounts on options + multi-account runner branch"
            git push
          fi
          git rm -f tools/apply_multi_account.py tools/multi-account-runner.patch .github/workflows/apply-multi-account.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove multi-account apply tooling"
            git push
          fi
