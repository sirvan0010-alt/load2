name: Apply multi-account runner patch
on:
  push:
    paths:
      - 'tools/multi-account-runner.patch'
      - '.github/workflows/apply-multi-account.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          git apply tools/multi-account-runner.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/SmtpTestRunner.cs
          if git diff --cached --quiet; then echo "no runner change"; else
            git commit -m "feat(account): wire multi-account path into SmtpTestRunner"
            git push
          fi
          git rm -f tools/multi-account-runner.patch .github/workflows/apply-multi-account.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove multi-account apply tooling"
            git push
          fi
