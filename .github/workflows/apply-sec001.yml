name: Apply SEC-001 logger patch
on:
  push:
    paths:
      - 'tools/apply_sec001_loggers.py'
      - '.github/workflows/apply-sec001.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_sec001_loggers.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/SmtpSessionLogger.cs src/MailLoadTester.Core/ProtocolPathObserver.cs
          if git diff --cached --quiet; then echo none; else
            git commit -m "fix(sec): wire ProtocolLogRedaction into session/path loggers"
            git push
          fi
          git rm -f tools/apply_sec001_loggers.py .github/workflows/apply-sec001.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove one-shot SEC-001 patch tooling"
            git push
          fi
