name: Apply GUI accounts wire
on:
  push:
    paths:
      - 'tools/apply_gui_accounts_wire.py'
      - '.github/workflows/apply-gui-accounts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_gui_accounts_wire.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Gui/MainForm.cs
          if git diff --cached --quiet; then echo none; else
            git commit -m "feat(gui): wire Accounts tab into MainForm BuildOptions"
            git push
          fi
          git rm -f tools/apply_gui_accounts_wire.py .github/workflows/apply-gui-accounts.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove GUI accounts apply tooling"
            git push
          fi
