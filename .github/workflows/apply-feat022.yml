name: Apply FEAT-022
on:
  push:
    paths:
      - 'tools/apply_feat022.py'
      - '.github/workflows/apply-feat022.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_feat022.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MailLoadTester.Core/Models.cs src/MailLoadTester.Core/SmtpTestRunner.cs
          if git diff --cached --quiet; then echo none; else
            git commit -m "feat(telemetry): wire FEAT-022 phase timings into runner"
            git push
          fi
          git rm -f tools/apply_feat022.py .github/workflows/apply-feat022.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove FEAT-022 apply tooling"
            git push
          fi
